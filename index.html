<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="Block-Man - a faithful remake of the 1993 Soleau Software puzzle game. Carry blocks, build stairs, escape the chambers of King Triangulos."
    />
    <title>Block-Man</title>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div>
            <h1 class="brand__title">Block-Man</h1>
            <p class="brand__sub">The chambers of King Triangulos</p>
          </div>
        </div>

        <div class="hud" role="group" aria-label="Game status">
          <div class="hud__cell">
            <span class="hud__label">Chamber</span>
            <span class="hud__value" id="hud-level">01</span>
          </div>
          <div class="hud__cell hud__cell--wide">
            <span class="hud__label">Name</span>
            <span class="hud__value hud__value--name" id="hud-name">First Steps</span>
          </div>
          <div class="hud__cell">
            <span class="hud__label">Moves</span>
            <span class="hud__value" id="hud-moves">0</span>
          </div>
          <div class="hud__cell">
            <span class="hud__label">Best</span>
            <span class="hud__value" id="hud-best">--</span>
          </div>
          <div class="hud__cell">
            <span class="hud__label">Hands</span>
            <span class="hud__value hud__value--carry" id="hud-carry" data-on="false">Empty-handed</span>
          </div>
        </div>

        <nav class="toolbar" aria-label="Game controls">
          <button type="button" class="btn btn--ghost" data-act="undo" title="Undo (U)">Undo</button>
          <button type="button" class="btn btn--ghost" data-act="reset" title="Restart chamber (R)">Restart</button>
          <button type="button" class="btn btn--ghost" data-act="levels" title="Chamber select (L)">Chambers</button>
          <button type="button" class="btn btn--ghost" data-act="help" title="How to play (?)">Rules</button>
          <button
            type="button"
            class="btn btn--icon"
            id="btn-sound"
            data-act="sound"
            data-on="true"
            aria-pressed="true"
            title="Mute sound (M)"
          >
            <span class="icon-sound" aria-hidden="true"></span>
            <span class="sr-only">Toggle sound</span>
          </button>
        </nav>
      </header>

      <main class="stage-wrap" id="stage-wrap">
        <canvas id="stage" width="480" height="192" aria-label="Block-Man playfield"></canvas>
      </main>

      <footer class="touchbar" aria-label="Touch controls">
        <button type="button" class="tbtn" data-act="left" aria-label="Turn and move left">&#9664;</button>
        <button type="button" class="tbtn tbtn--wide" data-act="grab" aria-label="Pick up or drop a block">
          Lift / Drop
        </button>
        <button type="button" class="tbtn" data-act="right" aria-label="Turn and move right">&#9654;</button>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
